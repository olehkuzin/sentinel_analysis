[project]
name = "sentinel-analysis"
version = "0.1.0"
description = "Czech Republic vegetation and urban heat dashboard using Copernicus satellite data"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "ee>=0.2",
    "folium>=0.20.0",
    "geemap>=0.37.2",
    "google>=3.0.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.10.8",
    "numpy>=2.4.4",
    "python-dotenv>=1.2.2",
    "rasterio>=1.5.0",
    "sentinelhub>=3.11.5",
    "windows-curses>=2.4.2; sys_platform == 'win32'",
    "pandas>=2.3",
    "plotly>=6.0.0",
    "scipy>=1.15",
    "streamlit>=1.45",
    "streamlit-folium>=0.25",
    "pyarrow>=19.0",
    "xarray>=2026.2.0",
    "netcdf4>=1.7.4",
    "h5netcdf>=1.8.1",
    "h5py>=3.16.0",
]
